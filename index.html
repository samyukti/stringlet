<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FFF8E7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1A1A2E" media="(prefers-color-scheme: dark)">
  <title>Stringlet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="phone-screen">
        <div class="phone-header">Stringlet</div>
        <div class="phone-card">
          <span class="phone-input">welcome<svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
        </div>
        <div class="phone-tiles">
          <span class="tile">W</span>
          <span class="tile">E</span>
          <span class="tile">L</span>
          <span class="tile">C</span>
          <span class="tile">O</span>
          <span class="tile">M</span>
          <span class="tile">E</span>
        </div>
        <div class="phone-results">
          <div class="phone-result-header">7 letters</div>
          <div class="phone-result-words">
            <a href="privacy/" class="word">privacy</a>
            <a href="support/" class="word">support</a>
          </div>
          <div class="phone-result-header">5 letters</div>
          <div class="phone-result-words">
            <a href="terms/" class="word">terms</a>
          </div>
        </div>
      </div>
      <div class="phone-bar"></div>
    </div>
  </div>
</body>
</html>
